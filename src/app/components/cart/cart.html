<h1 style="margin: 8%;">Carrello:</h1>
    <ul style="margin: 4%; display: flex; flex-direction: column;">
        @for(item of cartDetails(); track item.cartItem) {
            <li style="margin-top: 30px;">
                <span> {{item.cartItem.name}} - {{item.cartItem.price.toFixed(2)}} x {{item.cartItem.quantity}} </span>
                <br>
                <span> {{item.details}} </span>
            </li>
        }
    </ul>
    <label for="address">Inserire l' indirizzo di destinazione:</label>
    <input id="address" type="text" [(ngModel)]="userDetails.indirizzo">
    <button (click)="clickCheckout()">Checkout</button>
