<div class="singleMenu" style="margin: 50px; gap: 4px;">
    <h2>Modifica ingrediente</h2>
  <form #ingredienteForm="ngForm" (ngSubmit)="onIngredienteSubmit()" class="form-card">
    <div class="form-group">
      <label for="item-select">Categoria Ingrediente</label>
      <select id="item-select" name="item-select" [(ngModel)]="newIngrediente.idCategoriaIngrediente" required>
        @for (categoria of data.categorie; track categoria.id){
          @if(data.ingrediente.categoriaIngrediente.id == categoria.id){
          <option [value]="categoria.id" selected>
            {{categoria.nome}}
          </option>
          } @else {
          <option [value]="categoria.id">
            {{categoria.nome}}
          </option>
          }
        }
      </select>
    </div>

    <div class="form-group">
      <label for="nome">Nome</label>
      <input
        id="nome"
        type="text"
        name="nome"
        [(ngModel)]="newIngrediente.nome"
        required
      />
    </div>
    <div class="form-group">
      <label for="descrizione">Descrizione</label>
      <input
        id="descrizione"
        type="text"
        name="descrizione"
        [(ngModel)]="newIngrediente.descrizione"
      />
    </div>
    <div class="form-group">
      <label for="quantitaStock">Quantitá stock</label>
      <input
        id="quantitaStock"
        type="number"
        name="quantitaStock"
        [(ngModel)]="newIngrediente.quantitaStock"
      />
    </div>
    <div class="form-group">
      <label for="sovraprezzoAggiunta">Sovraprezzo aggiunta</label>
      <input
        id="sovraprezzoAggiunta"
        type="number"
        step="0.1"
        name="sovraprezzoAggiunta"
        [(ngModel)]="newIngrediente.sovraprezzoAggiunta"
        required
      />
    </div>
    <div class="form-group">
      <label for="prezzoRestock">Prezzo restock</label>
      <input
        id="prezzoRestock"
        type="number"
        step="0.1"
        name="prezzoRestock"
        [(ngModel)]="newIngrediente.prezzoRestock"
        required
      />
    </div>
    <div class="form-group">
      <label for="colore">Colore</label>
      <input
        id="colore"
        type="color"
        name="colore"
        [(ngModel)]="newIngrediente.colore"
      />
    </div>
    <div class="form-group">
      <label for="allergeni">Seleziona allergeni:</label>
      <select
        id="allergeni"
        multiple
        type="text"
        name="allergeni"
        [(ngModel)]="newIngrediente.idAllergeni">
        @for (allergene of data.allergeni; track allergene.id){
          @if(data.ingrediente.allergeni.includes(allergene)){
            <option [value]="allergene.id" selected>{{allergene.nome}}</option>
          } @else {
            <option [value]="allergene.id">{{allergene.nome}}</option>
          }          
        }
      
      </select>
    </div>

    <button type="submit" [disabled]="ingredienteForm.invalid">Modifica Ingrediente</button>
  </form>
  <br>
    <button (click)="close()">Cancel</button>
    @if(editWithSuccess()){
      <h4>Ingrediente modificato con successo!</h4>
    }
  </div>
