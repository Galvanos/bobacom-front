<div class="w-100 px-3">
  <table class="table custom-striped-table w-100 align-middle">
    <thead>
      <tr>
        <th>Id</th>
        <th>Username</th>
        <th>Ruolo</th>
        <th>Email</th>
        <th>Indirizzo</th>
        <th>Credito</th>
      </tr>
    </thead>
    <tbody>
      @for (utente of utenti; track utente.id) {
        <tr [routerLink]="['/dash/list-utenti/detail-utente-admin']" [state]="{utente: utente}" class="clickable-row">
          <td>{{ utente.id }}</td>
          <td>{{ utente.username }}</td>
          <td>{{ utente.ruolo }}</td>
          <td>{{ utente.email }}</td>
          <td>{{ utente.indirizzo }}</td>
          <td>{{ utente.credito }}</td>
        </tr>
      }
    </tbody>
  </table>
</div>
