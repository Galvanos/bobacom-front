<div class="container">
    <h1>Login</h1>
    <form #loginForm="ngForm" (ngSubmit)="onSubmit()">
        <mat-form-field>
            <mat-label>Username</mat-label>
            <input matInput type="text" name="userName" placeholder="introdurre username" ngModel required>
        </mat-form-field>
        <mat-form-field>
            <mat-label>Password</mat-label>
            <input matInput type="password" name="password" placeholder="introdurre password" ngModel required>
        </mat-form-field>
        <p style="color: red;">{{msg()}}</p>
        <div class="button-group">
            <button mat-raised-button color="primary" type="submit" [disabled]="!loginForm.valid">Login</button>
            <button mat-raised-button (click)="registrazione()"
                    matTooltip="Nuovo utente? Registrati.">Nuovo utente</button>
        </div>
    </form>
</div>
