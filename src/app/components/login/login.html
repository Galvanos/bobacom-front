<div class="container">
    <div class="cart-card">
    <h1>Login</h1>
    <form #loginForm="ngForm" (ngSubmit)="onSubmit()">
        <mat-form-field>
            <mat-label>Username</mat-label>
            <input matInput type="text" name="userName" placeholder="introdurre username" ngModel required>
        </mat-form-field>
        <mat-form-field>
            <mat-label>Password</mat-label>
            <input matInput type="password" name="password" placeholder="introdurre password" ngModel required>
        </mat-form-field>
        <p style="color: red;">{{msg()}}</p>
        <div class="button-group">
            <button mat-raised-button class="btn-primary" type="submit" [disabled]="!loginForm.valid">
                <mat-icon>login</mat-icon>
                <span>Login</span>
            </button>
            <button mat-raised-button class="btn-secondary" (click)="registrazione()"
                    matTooltip="Nuovo utente? Registrati.">
                    <mat-icon>person_add</mat-icon>
                    <span>Nuovo utente</span>
                </button>
        </div>
    </form>
    </div>
</div>
