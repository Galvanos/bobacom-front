<mat-card class="bubble-card" appearance="outlined">

  <div class="bubble-img-box">
    <img [src]="product().imageUrl" [alt]="product().name">
  </div>

  <mat-card-header class="bubble-card-header">
    <mat-card-title class="bubble-card-title">
      {{ product().name }}
    </mat-card-title>
  </mat-card-header>

  <mat-card-content class="tag-section">
    <mat-chip-set>
      @for (tag of product().tags; track tag) {
        <mat-chip class="custom-chip">
          {{ tag }}
        </mat-chip>
      }
    </mat-chip-set>
  </mat-card-content>

  <mat-card-content class="bubble-card-content">
    <p class="description">
      {{ product().description }}
    </p>

    <div class="qty-wrapper">
      <div class="product-qty">
        <button type="button" class="qty-btn" (click)="decrement()">−</button>
        <input type="text" class="input-number" [value]="quantity()" readonly>
        <button type="button" class="qty-btn" (click)="increment()">+</button>
      </div>
    </div>
  </mat-card-content>

  <mat-card-content class="card-actions">
    <button type="button" class="btn-add" (click)="addToCart()">
      Aggiungi €{{ totalPrice() }}
    </button>
    
    <button type="button" class="btn-customize" (click)="customizeProduct()">
      ✨ Personalizza
    </button>
  </mat-card-content>

</mat-card>
