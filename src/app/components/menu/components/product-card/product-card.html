<div class="product-card">
  
  <div class="card-media">
    <img [src]="product()?.imgUrl" [alt]="product()?.nome" class="product-img" />
  </div>

  <div class="card-body">
    <h3 class="product-title">{{ product()?.nome }}</h3>

    <div class="tag-group">
      @for (tag of product()?.tag ?? []; track tag.id) {
        <span class="badge-tag">{{ tag.nome }}</span>
      }
    </div>

    <p class="product-desc">{{ product()?.descrizione }}</p>
  </div>

  <div class="card-footer">
    <div class="action-bar">
      <div class="quantity-picker">
        <button type="button" class="qty-btn" (click)="decrement()">−</button>
        <span class="qty-val">{{ quantity() }}</span>
        <button type="button" class="qty-btn" (click)="increment()">+</button>
      </div>

      <button type="button" class="btn-add" (click)="addToCart()">
        Aggiungi €{{ totalPrice() }}
      </button>
    </div>

    <button type="button" class="btn-customize" (click)="customizeProduct()">
      ✨ Personalizza
    </button>
  </div>

</div>
