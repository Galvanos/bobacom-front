<!-- categories.component.html -->
<section class="py-5">
  <div class="container">
    <h2 class="text-center mb-4">Le nostre categorie</h2>
    <div class="row g-4">
      @for (cat of categorie; track cat.name) {
        <div class="col-6 col-md-3">
          <div class="card border-0 text-center h-100 shadow-sm">
            <img [src]="cat.image" class="card-img-top" [alt]="cat.name">
            <div class="card-body">
              <h6 class="card-title mb-0">{{ cat.name }}</h6>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
